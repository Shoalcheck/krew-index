apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: shoalcheck
spec:
  version: v0.1.6
  homepage: https://shoalcheck.com
  shortDescription: Read-only preflight and audit for your cluster
  description: |
    Shoalcheck answers one change before you make it: which node cannot be
    drained and the object that stops it (a budget at zero, a pod nothing
    recreates, a volume pinned to the node, work with nowhere to go), what
    stops the way to a Kubernetes version, and what losing a zone would
    strand. A full reading lists reliability, security and cost findings,
    each tied to the object it rests on, and is kept so the next reading of
    the same cluster says what changed. What it could not read is reported
    as not read, never as passed.
  caveats: |
    Shoalcheck is read-only: it uses get and list only and never writes to the
    cluster. The exact RBAC it needs can be printed with `audit --show-permissions`.
    A preflight models less than the scheduler: it can say a change will stop,
    not promise that it will succeed. Some commands need a licence; see
    https://shoalcheck.com.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/Shoalcheck/shoalcheck/releases/download/v0.1.6/kubectl-shoalcheck_0.1.6_darwin_amd64.tar.gz
    sha256: d2ca36c75095aae57a033f8a1093bf5f2fb021c10da192728fb8ac79fcf2607b
    files:
    - from: kubectl-shoalcheck
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-shoalcheck
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/Shoalcheck/shoalcheck/releases/download/v0.1.6/kubectl-shoalcheck_0.1.6_darwin_arm64.tar.gz
    sha256: 2fb8ecc288900cfbd41c6a217b7381b22bc271af3876713d20e4c986aa5134c2
    files:
    - from: kubectl-shoalcheck
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-shoalcheck
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/Shoalcheck/shoalcheck/releases/download/v0.1.6/kubectl-shoalcheck_0.1.6_linux_amd64.tar.gz
    sha256: 47d86297dbf0637a380287200dd54137b7646b4f33053446bc8ed64594e3a62d
    files:
    - from: kubectl-shoalcheck
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-shoalcheck
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/Shoalcheck/shoalcheck/releases/download/v0.1.6/kubectl-shoalcheck_0.1.6_linux_arm64.tar.gz
    sha256: 123682a821354d87d7d6b76e98c73c6bff189acf0cdb3bfecfb1186a19fa77db
    files:
    - from: kubectl-shoalcheck
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-shoalcheck
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/Shoalcheck/shoalcheck/releases/download/v0.1.6/kubectl-shoalcheck_0.1.6_windows_amd64.zip
    sha256: c141cfc9c9fd6e08eca5608435a5ed164c6e9830f63d5d1723b3752d2bfadacb
    files:
    - from: kubectl-shoalcheck.exe
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-shoalcheck.exe
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    uri: https://github.com/Shoalcheck/shoalcheck/releases/download/v0.1.6/kubectl-shoalcheck_0.1.6_windows_arm64.zip
    sha256: e5d5ae6d11e9847e0b8b214f9278a0f8f83bbf44152109ba2b4df11713a786a2
    files:
    - from: kubectl-shoalcheck.exe
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-shoalcheck.exe
