apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: shoalcheck
spec:
  version: v0.2.1
  homepage: https://shoalcheck.com
  shortDescription: Read-only preflight and audit for your cluster
  description: |
    Shoalcheck answers one change before you make it: which node cannot be
    drained and the object that stops it (a budget at zero, a pod nothing
    recreates, a volume pinned to the node, work with nowhere to go), what
    stops the way to a Kubernetes version, and what losing a zone would
    strand. A full reading lists reliability, security and cost findings,
    each tied to the object it rests on, and is kept so the next reading of
    the same cluster says what changed. What it could not read is reported
    as not read, never as passed.
  caveats: |
    Shoalcheck is read-only: it uses get and list only and never writes to the
    cluster. The exact RBAC it needs can be printed with `audit --show-permissions`.
    A preflight models less than the scheduler: it can say a change will stop,
    not promise that it will succeed. Some commands need a licence; see
    https://shoalcheck.com.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/Shoalcheck/shoalcheck/releases/download/v0.2.1/kubectl-shoalcheck_0.2.1_darwin_amd64.tar.gz
    sha256: 27b76d565e9fe6bc288800365b8548b7d1917f3a227b91d66a103f1c5b922fa2
    files:
    - from: kubectl-shoalcheck
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-shoalcheck
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/Shoalcheck/shoalcheck/releases/download/v0.2.1/kubectl-shoalcheck_0.2.1_darwin_arm64.tar.gz
    sha256: 3d20d7942e733772ac6fa54ef94e842caad7597c52592fd9c9ad95b8dd7e8bae
    files:
    - from: kubectl-shoalcheck
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-shoalcheck
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/Shoalcheck/shoalcheck/releases/download/v0.2.1/kubectl-shoalcheck_0.2.1_linux_amd64.tar.gz
    sha256: a6a97c358894e2470702e26b8360bf948b9453b7c0f712f009526087aebfee6d
    files:
    - from: kubectl-shoalcheck
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-shoalcheck
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/Shoalcheck/shoalcheck/releases/download/v0.2.1/kubectl-shoalcheck_0.2.1_linux_arm64.tar.gz
    sha256: 234f1afbd97e7cee96822ec8875098c94cab60aea32964ff8ac969a08b96d51f
    files:
    - from: kubectl-shoalcheck
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-shoalcheck
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/Shoalcheck/shoalcheck/releases/download/v0.2.1/kubectl-shoalcheck_0.2.1_windows_amd64.zip
    sha256: d88393ebef6cdcf30ac3df13517069418d4cdeab79a641bae4e375c06da63b1b
    files:
    - from: kubectl-shoalcheck.exe
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-shoalcheck.exe
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    uri: https://github.com/Shoalcheck/shoalcheck/releases/download/v0.2.1/kubectl-shoalcheck_0.2.1_windows_arm64.zip
    sha256: 28e32ffd01cb5f30ef0d8d8dc503a3f61bb8d476e951ef200b66ddffad713ffe
    files:
    - from: kubectl-shoalcheck.exe
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-shoalcheck.exe
