apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: shoalcheck
spec:
  version: v0.1.5
  homepage: https://shoalcheck.com
  shortDescription: Read-only preflight and audit for your cluster
  description: |
    Shoalcheck answers one change before you make it: which node cannot be
    drained and the object that stops it (a budget at zero, a pod nothing
    recreates, a volume pinned to the node, work with nowhere to go), what
    stops the way to a Kubernetes version, and what losing a zone would
    strand. A full reading lists reliability, security and cost findings,
    each tied to the object it rests on, and is kept so the next reading of
    the same cluster says what changed. What it could not read is reported
    as not read, never as passed.
  caveats: |
    Shoalcheck is read-only: it uses get and list only and never writes to the
    cluster. The exact RBAC it needs can be printed with `audit --show-permissions`.
    A preflight models less than the scheduler: it can say a change will stop,
    not promise that it will succeed. Some commands need a licence; see
    https://shoalcheck.com.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/Shoalcheck/shoalcheck/releases/download/v0.1.5/kubectl-shoalcheck_0.1.5_darwin_amd64.tar.gz
    sha256: 39b0d8cae46e796d25b70cbba49f181764f2101fff3adb0c1bcbece8ec107274
    files:
    - from: kubectl-shoalcheck
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-shoalcheck
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/Shoalcheck/shoalcheck/releases/download/v0.1.5/kubectl-shoalcheck_0.1.5_darwin_arm64.tar.gz
    sha256: e13ac48479d27f18823a401354f643cfa9dd211e8b91d686ac216b3d860465d5
    files:
    - from: kubectl-shoalcheck
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-shoalcheck
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/Shoalcheck/shoalcheck/releases/download/v0.1.5/kubectl-shoalcheck_0.1.5_linux_amd64.tar.gz
    sha256: 197fd8e072833bf92b91177bc9d906782c1b188cc0a1507892c2aa0a78f7c7cb
    files:
    - from: kubectl-shoalcheck
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-shoalcheck
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/Shoalcheck/shoalcheck/releases/download/v0.1.5/kubectl-shoalcheck_0.1.5_linux_arm64.tar.gz
    sha256: d845d45543a2f5033cb04b373a0dba79dd93ab12465ea3eb48c3561f0b68e208
    files:
    - from: kubectl-shoalcheck
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-shoalcheck
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/Shoalcheck/shoalcheck/releases/download/v0.1.5/kubectl-shoalcheck_0.1.5_windows_amd64.zip
    sha256: 2ca20217964f8daba3765a7be61a31da0f9a79c92d7f3d4a177617f27dd6d356
    files:
    - from: kubectl-shoalcheck.exe
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-shoalcheck.exe
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    uri: https://github.com/Shoalcheck/shoalcheck/releases/download/v0.1.5/kubectl-shoalcheck_0.1.5_windows_arm64.zip
    sha256: 2b09486632b548365d567e710dc7935d02c11b98f7d9adfc9b136d467dcd2223
    files:
    - from: kubectl-shoalcheck.exe
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-shoalcheck.exe
