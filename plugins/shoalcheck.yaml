apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: shoalcheck
spec:
  version: v0.2.0
  homepage: https://shoalcheck.com
  shortDescription: Read-only preflight and audit for your cluster
  description: |
    Shoalcheck answers one change before you make it: which node cannot be
    drained and the object that stops it (a budget at zero, a pod nothing
    recreates, a volume pinned to the node, work with nowhere to go), what
    stops the way to a Kubernetes version, and what losing a zone would
    strand. A full reading lists reliability, security and cost findings,
    each tied to the object it rests on, and is kept so the next reading of
    the same cluster says what changed. What it could not read is reported
    as not read, never as passed.
  caveats: |
    Shoalcheck is read-only: it uses get and list only and never writes to the
    cluster. The exact RBAC it needs can be printed with `audit --show-permissions`.
    A preflight models less than the scheduler: it can say a change will stop,
    not promise that it will succeed. Some commands need a licence; see
    https://shoalcheck.com.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/Shoalcheck/shoalcheck/releases/download/v0.2.0/kubectl-shoalcheck_0.2.0_darwin_amd64.tar.gz
    sha256: 59d4b35aa5d07247a602dc43648a29a200abda5937f8b9ec9a315fe36d050d62
    files:
    - from: kubectl-shoalcheck
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-shoalcheck
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/Shoalcheck/shoalcheck/releases/download/v0.2.0/kubectl-shoalcheck_0.2.0_darwin_arm64.tar.gz
    sha256: 4ca6d2c80e9a39aa4dd26cadcce95ed1e75400e7ae9e51519e704314dc0a11e4
    files:
    - from: kubectl-shoalcheck
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-shoalcheck
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/Shoalcheck/shoalcheck/releases/download/v0.2.0/kubectl-shoalcheck_0.2.0_linux_amd64.tar.gz
    sha256: c7cca705deb89f6f98a4d4566b3e18c9dfc667b87a761e2113aeac32f0f3431c
    files:
    - from: kubectl-shoalcheck
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-shoalcheck
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/Shoalcheck/shoalcheck/releases/download/v0.2.0/kubectl-shoalcheck_0.2.0_linux_arm64.tar.gz
    sha256: fd2e87e48870e9cf4c2a1692476861cd6aee396d2d93d13489fc727216a99d50
    files:
    - from: kubectl-shoalcheck
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-shoalcheck
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/Shoalcheck/shoalcheck/releases/download/v0.2.0/kubectl-shoalcheck_0.2.0_windows_amd64.zip
    sha256: 7d53ff1274b44c8658b03b7c20ffd2f05d45d0f1e92a48df417450339e1dd003
    files:
    - from: kubectl-shoalcheck.exe
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-shoalcheck.exe
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    uri: https://github.com/Shoalcheck/shoalcheck/releases/download/v0.2.0/kubectl-shoalcheck_0.2.0_windows_arm64.zip
    sha256: 20f1722d05404115ee92a535d28d03efeeb0b3905cf72046f9622f89b6336ec7
    files:
    - from: kubectl-shoalcheck.exe
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-shoalcheck.exe
